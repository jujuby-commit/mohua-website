    "body": "1958 年，巴塞隆納。Enric Bernat 剛把一間叫 Granja Asturias 的蘋果果醬工廠百分之百買下來。他 1954 年進這間廠工作，四年後成了它的主人。\n\n他注意到一件小事：小孩吃糖，會把糖含進嘴裡、再用手拿出來看看，手指黏答答，衣服跟著沾，然後被媽媽念。\n\n他的解法是插一根棍子。公司後來自己的說法是，他要的是「像用叉子吃糖」的那種東西。\n\n1958 年第一批推出七種口味：草莓、柳橙、檸檬、草莓奶油、巧克力香草、咖啡奶油、薄荷。\n\n名字反而是最難搞定的部分。最早叫 GOL，因為糖球圓得像足球，含在嘴裡像射門進網。後來改成 CHUPS。1963 年，一首廣告歌把「Chupa Chups」這個講法唱進大家腦子裡，名字才定下來——西班牙文的 chupar，就是吸吮的意思。\n\n十一年後，他要處理另一件事：這支糖看起來該長什麼樣。\n\n1969 年，Bernat 找上 Salvador Dalí。\n\n兩個人坐下來喝咖啡，達利就地拿了報紙開始畫。據幾份設計史料的記述，他花了不到一個小時，交出一朵雛菊，中間放品牌名。\n\n真正厲害的是他順手提的第二件事：這個 logo 不要印在包裝側面，要印在頂端。\n\n理由很實際。棒棒糖是圓的，包裝紙從側面看永遠是皺的、扭的、被手指壓過的；印在頂端那一面，圖案永遠攤平、永遠完整，不管糖果丟在櫃檯上、插在罐子裡、還是握在小孩手上，你看到的都是同一朵花。\n\n後面的事就快了。1990 年，這支棒棒糖賣進一百六十四個國家。1995 年，俄羅斯和平號太空站的太空人把它帶上了太空。2017 年，全球口味超過一百種。\n\n2006 年 7 月，Chupa Chups 被義大利與荷蘭合資的 Perfetti Van Melle 買下，那年公司營收五億歐元，員工兩千人。\n\n達利在那張報紙上畫的雛菊，到現在還印在每一顆糖的頂端。"
  }
]</script>
<script>
(function(){
  var data = JSON.parse(document.getElementById('data').textContent);
  var PAGE_SIZE = 9;
  var currentPage = 1;
  var baseData = data.slice().reverse(); // newest (highest order) first
  var filtered = baseData;

  var FAVORITES_KEY = 'wdh_favorites';
  var favorites = (function(){
    try { return new Set(JSON.parse(localStorage.getItem(FAVORITES_KEY) || '[]')); }
    catch(e){ return new Set(); }
  })();
  function saveFavorites(){
    try { localStorage.setItem(FAVORITES_KEY, JSON.stringify(Array.from(favorites))); } catch(e){}
  }
  function syncMarkInputs(order){
    document.querySelectorAll('.mark-input[data-order="' + order + '"]').forEach(function(el){
      el.checked = favorites.has(order);
    });
  }
  function updateFavCount(){
    var el = document.getElementById('favCount');
    if(el) el.textContent = favorites.size;
  }
  document.addEventListener('change', function(e){
    if(!e.target.classList || !e.target.classList.contains('mark-input')) return;
    var order = parseInt(e.target.dataset.order, 10);
    if(!order) return;
    if(favorites.has(order)) favorites.delete(order); else favorites.add(order);
    saveFavorites();
    syncMarkInputs(order);
    updateFavCount();
  });

  function esc(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function renderBody(text){
    var blocks = text.split(/\n\s*\n/);
    return blocks.map(function(block){
      var b = block.trim();
      if(!b) return '';
      if(/^-{3,}$/.test(b)) return '<hr>';
      if(/^##\s+/.test(b)){
        return '<h4>' + esc(b.replace(/^##\s+/,'')) + '</h4>';
      }
      var pullMatch = /^\*\*([^*]+)\*\*$/.exec(b);
      if(pullMatch){
        return '<p class="pull">' + esc(pullMatch[1]).replace(/\n/g,'<br>') + '</p>';
      }
      var line = esc(b).replace(/\n/g,'<br>');
      line = line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      return '<p>' + line + '</p>';
    }).join('');
  }
  function estimateReadTime(text){
    var chars = text.replace(/\*\*/g,'').replace(/##[^\n]*/g,'').replace(/[\s\n]/g,'').length;
    return Math.max(1, Math.round(chars/400));
  }
  function excerpt(a){
    if(a.subtitle) return a.subtitle;
    var firstPara = a.body.split(/\n\s*\n/)[0] || '';
    return firstPara.replace(/\n/g,' ').slice(0, 60);
  }
  function plateClass(order){
    return 'plate-' + (((order - 1) % 4) + 1);
  }

  var gridEl = document.getElementById('grid');
  var countEl = document.getElementById('count');
  var noMatch = document.getElementById('noMatch');
  var paginationEl = document.getElementById('pagination');
  var searchInput = document.getElementById('search');
  var favToggle = document.getElementById('favToggle');
  var viewAllToggle = document.getElementById('viewAllToggle');
  var sectionTitle = document.getElementById('sectionTitle');
  var showFavoritesOnly = false;
  var showAllOnPage = false;

  viewAllToggle.addEventListener('click', function(){
    showAllOnPage = !showAllOnPage;
    viewAllToggle.setAttribute('aria-pressed', showAllOnPage ? 'true' : 'false');
    currentPage = 1;
    renderGrid();
  });

  function applyFilters(){
    var q = searchInput.value.trim().toLowerCase();
    var pool = showFavoritesOnly ? baseData.filter(function(a){ return favorites.has(a.order); }) : baseData;
    filtered = !q ? pool : pool.filter(function(a){
      var hay = (a.title + ' ' + (a.subtitle||'') + ' ' + a.order + ' ' + String(a.order).padStart(3,'0') + ' ' + (a.num||'')).toLowerCase();
      return hay.indexOf(q) !== -1;
    });
    currentPage = 1;
    renderGrid();
  }

  favToggle.addEventListener('click', function(){
    showFavoritesOnly = !showFavoritesOnly;
    favToggle.setAttribute('aria-pressed', showFavoritesOnly ? 'true' : 'false');
    sectionTitle.textContent = showFavoritesOnly ? '我的收藏' : '全部故事';
    noMatch.textContent = showFavoritesOnly ? '還沒有收藏的篇章，點進文章右上角的書籤圖示就能收藏。' : '沒有符合的篇章。';
    applyFilters();
  });

  function renderGrid(){
    var total = filtered.length;
    var pageSize = showAllOnPage ? Math.max(total, 1) : PAGE_SIZE;
    var totalPages = Math.max(1, Math.ceil(total / pageSize));
    if(currentPage > totalPages) currentPage = totalPages;
    if(currentPage < 1) currentPage = 1;

    var start = (currentPage - 1) * pageSize;
    var pageItems = filtered.slice(start, start + pageSize);

    countEl.textContent = total + ' 篇';
    noMatch.style.display = total === 0 ? 'block' : 'none';

    gridEl.innerHTML = pageItems.map(function(a){
      return '<a class="card" href="#/' + a.order + '">' +
        '<div class="plate ' + plateClass(a.order) + '"><span class="plate-no">' + String(a.order).padStart(3,'0') + '</span></div>' +
        '<span class="card-body">' +
          '<span class="card-title">' + esc(a.title) + '</span>' +
          '<span class="card-sub">' + esc(excerpt(a)) + '</span>' +
          (a.date ? '<span class="card-date">' + esc(a.date) + '</span>' : '') +
        '</span>' +
      '</a>';
    }).join('');

    if(total <= pageSize){
      paginationEl.innerHTML = '';
    } else {
      var nums = pageNumbers(currentPage, totalPages);
      var numsHtml = nums.map(function(n){
        if(n === '…') return '<span class="page-ellipsis">…</span>';
        return '<button class="page-num' + (n===currentPage ? ' current' : '') + '" data-page="' + n + '"' + (n===currentPage ? ' aria-current="page"' : '') + '>' + n + '</button>';
      }).join('');
      paginationEl.innerHTML =
        '<button id="prevPage" aria-label="上一頁"' + (currentPage<=1 ? ' disabled' : '') + '>←</button>' +
        '<span class="page-nums">' + numsHtml + '</span>' +
        '<button id="nextPage" aria-label="下一頁"' + (currentPage>=totalPages ? ' disabled' : '') + '>→</button>';

      function goTo(p){ currentPage = p; renderGrid(); window.scrollTo({top: document.querySelector('.section-label').offsetTop - 20, behavior:'smooth'}); }
      var prevBtn = document.getElementById('prevPage');
      var nextBtn = document.getElementById('nextPage');
      if(prevBtn) prevBtn.addEventListener('click', function(){ goTo(currentPage-1); });
      if(nextBtn) nextBtn.addEventListener('click', function(){ goTo(currentPage+1); });
      paginationEl.querySelectorAll('.page-num').forEach(function(btn){
        btn.addEventListener('click', function(){ goTo(parseInt(btn.dataset.page,10)); });
      });
    }
  }

  function pageNumbers(current, total){
    var pages = [];
    for(var i=1;i<=total;i++){
      if(i===1 || i===total || Math.abs(i-current)<=1){
        pages.push(i);
      } else if(pages[pages.length-1] !== '…'){
        pages.push('…');
      }
    }
    return pages;
  }

  searchInput.addEventListener('input', applyFilters);

  updateFavCount();

  var artNo = document.getElementById('artNo');
  var artMarkInput = document.getElementById('artMarkInput');
  var artMeta = document.getElementById('artMeta');
  var artTitle = document.getElementById('artTitle');
  var artSub = document.getElementById('artSub');
  var artBody = document.getElementById('artBody');
  var prevLink = document.getElementById('prevLink');
  var nextLink = document.getElementById('nextLink');

  function showArticle(order){
    var idx = order - 1;
    var a = data[idx];
    if(!a) return route();

    artNo.textContent = 'NO. ' + String(a.order).padStart(3,'0');
    artMarkInput.dataset.order = a.order;
    artMarkInput.checked = favorites.has(a.order);

    var metaParts = [];
    if(a.date) metaParts.push(esc(a.date));
    metaParts.push('約 ' + estimateReadTime(a.body) + ' 分鐘');
    artMeta.innerHTML = metaParts.map(function(m){ return '<span>' + m + '</span>'; }).join('<span class="dot">·</span>');

    artTitle.textContent = a.title;
    if(a.subtitle){ artSub.style.display=''; artSub.textContent = a.subtitle; }
    else { artSub.style.display='none'; }
    artBody.innerHTML = renderBody(a.body);

    var prev = data[idx-1], next = data[idx+1];
    prevLink.style.visibility = prev ? 'visible' : 'hidden';
    nextLink.style.visibility = next ? 'visible' : 'hidden';
    if(prev) prevLink.innerHTML = '← 上一篇<b>' + esc(prev.title) + '</b>';
    if(prev) prevLink.href = '#/' + prev.order;
    if(next) nextLink.innerHTML = '下一篇 →<b>' + esc(next.title) + '</b>';
    if(next) nextLink.href = '#/' + next.order;

    document.body.classList.add('reading');
    document.title = a.title + '｜世界甜點史';
    window.scrollTo(0,0);
  }

  function route(){
    var hash = location.hash;
    var m = hash.match(/^#\/(\d+)/);
    if(m){
      showArticle(parseInt(m[1],10));
    } else {
      document.body.classList.remove('reading');
      document.title = '世界甜點史｜連載選輯';
      applyFilters();
    }
  }

  window.addEventListener('hashchange', route);
  route();
})();
</script>

</body>
